<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">🤖 Meu AI</div>

        <button class="new-chat" type="button" onclick="newChat()">
            ＋ Nova conversa
        </button>

        <div class="history">
            <h3>Conversas</h3>
            <div id="historyList"></div>
        </div>

        <div class="sidebar-bottom">

            <button type="button" onclick="toggleTheme()">
                🌙 Tema
            </button>

            <button type="button" onclick="showSettings()">
                ⚙️ Definições
            </button>

        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <button
                class="menu"
                type="button"
                onclick="toggleSidebar()"
                title="Abrir menu"
            >
                ☰
            </button>

            <span>Meu AI</span>

            <!-- 🧍 ABRIR BONECO -->
            <button
                type="button"
                onclick="abrirBoneco()"
                title="Abrir boneco"
            >
                🧍
            </button>

            <!-- 🔊 LIGAR/DESLIGAR VOZ -->
            <button
                id="voiceToggle"
                type="button"
                onclick="toggleVoice()"
                title="Ligar/desligar voz"
            >
                🔊
            </button>

        </header>


        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <div class="robot">🤖</div>

                <h1>Olá! Eu sou o Meu AI</h1>

                <p>Pergunta-me qualquer coisa.</p>

                <div class="suggestions">

                    <button
                        type="button"
                        onclick="suggest('Explica-me como funciona a inteligência artificial')"
                    >
                        🧠 Explicar IA
                    </button>

                    <button
                        type="button"
                        onclick="suggest('Ajuda-me a criar um programa')"
                    >
                        💻 Programar
                    </button>

                    <button
                        type="button"
                        onclick="suggest('Dá-me uma ideia para um projeto')"
                    >
                        💡 Ideias
                    </button>

                    <button
                        type="button"
                        onclick="suggest('Conta-me uma curiosidade')"
                    >
                        🌎 Curiosidade
                    </button>

                </div>

            </div>

        </section>


        <div class="input-area">

            <div class="input-box">

                <!-- 📎 FICHEIRO -->

                <button
                    class="icon"
                    type="button"
                    onclick="document.getElementById('fileInput').click()"
                    title="Enviar ficheiro"
                >
                    📎
                </button>

                <input
                    type="file"
                    id="fileInput"
                    accept=".txt,.md,.json,.csv,.pdf"
                    hidden
                    onchange="uploadFile()"
                >


                <!-- 🖼️ IMAGEM -->

                <button
                    class="icon"
                    type="button"
                    onclick="document.getElementById('imageInput').click()"
                    title="Enviar imagem"
                >
                    🖼️
                </button>

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    hidden
                    onchange="uploadImage()"
                >


                <!-- 💬 MENSAGEM -->

                <textarea
                    id="messageInput"
                    placeholder="Escreve uma mensagem..."
                    rows="1"
                    onkeydown="handleKey(event)"
                ></textarea>


                <!-- 🎤 MICROFONE -->

                <button
                    class="icon"
                    type="button"
                    onclick="startVoice()"
                    title="Falar com o Meu AI"
                >
                    🎤
                </button>


                <!-- ➤ ENVIAR -->

                <button
                    class="send"
                    type="button"
                    onclick="sendMessage()"
                    title="Enviar"
                >
                    ➤
                </button>

            </div>

            <small>
                O Meu AI pode cometer erros. Verifica informações importantes.
            </small>

        </div>

    </main>

</div>


<!-- ⚙️ DEFINIÇÕES -->

<div class="modal" id="settingsModal">

    <div class="settings">

        <button
            class="close"
            type="button"
            onclick="closeSettings()"
        >
            ✕
        </button>

        <h2>⚙️ Definições</h2>

        <label>
            Nome do assistente

            <input
                id="assistantName"
                value="Meu AI"
            >
        </label>

        <label>
            Mensagem inicial

            <input
                id="welcomeMessage"
                value="Olá! Eu sou o Meu AI"
            >
        </label>

        <button
            class="save"
            type="button"
            onclick="saveSettings()"
        >
            Guardar
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
